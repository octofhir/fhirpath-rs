[package]
name = "octofhir-fhirpath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/octofhir-fhirpath"
description = "A high-performance FHIRPath implementation in Rust with comprehensive spec compliance"
readme = "../../README.md"
keywords = ["fhir", "fhirpath", "healthcare", "hl7", "parser"]
categories = ["parser-implementations", "data-structures", "science"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "Cargo.toml",
]

[lib]
name = "octofhir_fhirpath"
path = "src/lib.rs"

[lints]
workspace = true


[dependencies]
octofhir-fhir-model = { workspace = true }

# Core dependencies
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
log = { workspace = true }
papaya = { workspace = true }
octofhir-ucum = { workspace = true }
moka = { version = "0.12", features = ["sync"] }
uuid = { workspace = true }
tracing = { workspace = true }
chumsky = { version = "0.13", features = ["pratt"] }
ariadne = "0.6"
tabled = { version = "0.22", default-features = false, features = ["std"] }

url = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
urlencoding = "2.1"
html-escape = "0.3"
stacker = "0.1"

# Async dependencies
async-trait = { workspace = true }
async-recursion = "1.1"
# VM wakers and optional WebSocket helpers; no executor/channel facade.
futures = { package = "futures-util", version = "0.3.34", default-features = false, features = ["std", "async-await"] }
tokio = { workspace = true, features = ["sync"] }

# Optional diagnostic dependencies
colored = { workspace = true }

# Optional LSP dependencies
async-lsp = { version = "0.2", default-features = false, features = ["tracing"], optional = true }
# Pinned to 0.95 to match the lsp-types version re-exported by async-lsp 0.2;
# bumping it puts two incompatible lsp_types copies in the graph.
lsp-types = { version = "0.95", optional = true }
tower = { version = "0.5", optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
# WebSocket transport for LSP
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

# Browsers have no OS entropy source; uuid draws from `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
divan = "0.1"
pretty_assertions = "1.4.1"
rstest = "0.28"
rust_decimal_macros = "1.40"
tokio = { workspace = true, features = ["full"] }

[features]
default = []
mock-provider = [] # Include MockModelProvider for testing and development
analysis = []      # Include static analysis features
sql-on-fhir = []   # SQL on FHIR functions: getResourceKey(), getReferenceKey([type])
# Editor transport without the HTTP/WebSocket host.
lsp-stdio = [
    "dep:async-lsp",
    "dep:lsp-types",
    "dep:tower",
    "dep:tokio-util",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/io-std",
    "tokio/io-util",
]
# Preserve the existing full LSP feature, including upstream helpers and WebSockets.
lsp = [
    "lsp-stdio",
    "async-lsp/default",
    "async-lsp/tokio",
    "dep:axum",
    "dep:tower-http",
    "futures/sink",
    "tokio/net",
]

[[bench]]
name = "evaluation_hot_paths"
harness = false

[[bench]]
name = "prepared_constraints"
harness = false

[[bench]]
name = "parser_modes"
harness = false
